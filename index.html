<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TercihAtlas" />
  <title>TercihAtlas — YKS 2027 Tercih & Üniversite Rehberi</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css?v=6" />
</head>
<body>
  <!-- macOS Tahoe / iPadOS Floating Liquid Glass Navigation -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a href="#" class="brand" id="brandHome">
          <img src="icon.svg" alt="TercihAtlas" class="brand-logo" />
          <span>TercihAtlas</span>
        </a>
      </div>

      <nav class="nav-glass-capsule" id="desktopNav" aria-label="Ana sekmeler">
        <button class="nav-pill-btn active" data-tab="preferences">
          <span>Tercihlerim</span>
          <span class="nav-count tabular" id="prefCountBadge">0</span>
        </button>
        <button class="nav-pill-btn" data-tab="compare">
          <span>Karşılaştır</span>
          <span class="nav-count tabular" id="compareCountBadge">0</span>
        </button>
        <button class="nav-pill-btn" data-tab="analysis">Analiz</button>
        <button class="nav-pill-btn" data-tab="abroad">
          <span>Yurt Dışı</span>
          <span class="nav-count tabular" id="abroadCountBadge">0</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <button class="glass-icon-btn" id="openMyNetsBtn" title="Kendi TYT/AYT Netlerini Gir ve Bölümlerle Kıyasla">
          <svg class="sf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16"/><path d="M7 15V9"/><path d="M12 15V5"/><path d="M17 15v-3"/></svg>
          <span class="sync-label">Netlerim</span>
        </button>
        <button class="glass-icon-btn" id="openSyncBtn" title="Bulut Eşitleme ve Yedekleme">
          <span class="status-dot" id="syncDot"></span>
          <span class="sync-label" id="syncLabel">Yerel</span>
        </button>
        <button class="glass-icon-btn circle" id="themeToggleBtn" title="Açık / Koyu Mod" aria-label="Tema Değiştir">
          <svg id="themeIcon" class="sf-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <button class="btn btn-primary btn-primary-nav" id="openAddBtn">
          <svg class="sf-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>Ekle</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Read-Only Share Mode Banner Host -->
  <div id="shareBannerHost"></div>

  <!-- Main Workspace -->
  <main class="main" id="mainRoot"></main>

  <!-- iOS 26 Floating Liquid Glass Bottom Tab Capsule -->
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobil navigasyon">
    <button class="mobile-nav-btn active" data-mobile-tab="preferences">
      <svg class="sf-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path d="M7.5 9.5h9M7.5 14h5.5"/></svg>
      <span>Tercihler</span>
    </button>
    <button class="mobile-nav-btn" data-mobile-tab="compare">
      <svg class="sf-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7.5" height="16" rx="2.5"/><rect x="13.5" y="4" width="7.5" height="16" rx="2.5"/></svg>
      <span>Karşılaştır</span>
    </button>
    <button class="mobile-nav-btn" data-mobile-tab="analysis">
      <svg class="sf-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><path d="M5 15.5l4.5-4.5 3.5 3.5L19 7.5"/></svg>
      <span>Analiz</span>
    </button>
    <button class="mobile-nav-btn" data-mobile-tab="abroad">
      <svg class="sf-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span>Yurt Dışı</span>
    </button>
  </nav>

  <!-- Large Centered Apple Sheet Window (Desktop) / iOS 26 Bottom Sheet (Mobile) -->
  <div class="backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="detailDrawer" aria-hidden="true">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div id="drawerContent" style="display:flex;flex-direction:column;flex:1;min-height:0;"></div>
  </aside>

  <!-- macOS Spotlight Style Live YÖK Atlas Search & Code/Link Modal (⌘K) -->
  <div class="modal-overlay spotlight-overlay" id="addModalOverlay" aria-hidden="true">
    <div class="modal" style="width:min(660px, 100%);" role="dialog" aria-labelledby="addModalLabel">
      <span id="addModalLabel" class="sr-only">YÖK Atlas'ta Ara veya Program Kodu Ekle</span>
      <div class="spotlight-bar">
        <svg class="sf-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"/><path d="m20 20-3.8-3.8"/>
        </svg>
        <textarea
          id="programCodeInput"
          class="spotlight-input"
          rows="1"
          placeholder="Bölüm/üni ara (ör. İTÜ Bilgisayar) veya kod/link yapıştır..."
        ></textarea>
        <button class="btn btn-primary btn-sm" id="fetchProgramBtn">Ara / Getir</button>
        <button class="btn btn-ghost btn-icon btn-sm" id="closeAddModalBtn" aria-label="Kapat">
          <svg class="sf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="spotlight-body">
        <div class="spotlight-filters">
          <select id="spotPuanTuru" class="select toolbar-select" style="height:30px;font-size:12px;">
            <option value="">Tüm Puan Türleri</option>
            <option value="SAY">SAY</option>
            <option value="EA">EA</option>
            <option value="SÖZ">SÖZ</option>
            <option value="DİL">DİL</option>
          </select>
          <select id="spotUniTuru" class="select toolbar-select" style="height:30px;font-size:12px;">
            <option value="">Devlet + Vakıf</option>
            <option value="DEVLET">Sadece Devlet</option>
            <option value="VAKIF">Sadece Vakıf</option>
          </select>
          <input id="spotMaxRank" class="input tabular" type="number" min="1" step="1000" placeholder="Max sıralama (ör. 30000)" style="width:170px;height:30px;padding:0 11px;border-radius:999px;font-size:12px;" />
          <div style="display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;">
            <button class="quick-chip" type="button" data-sample-query="İTÜ Bilgisayar">İTÜ Bilgisayar</button>
            <button class="quick-chip" type="button" data-sample-query="Ankara Devlet Tıp">Ankara Tıp</button>
            <button class="quick-chip" type="button" data-sample-query="İstanbul EA Ekonomi">İstanbul Ekonomi</button>
          </div>
        </div>
        <div id="addModalFeedback"></div>
        <div id="addModalPreview"></div>
      </div>
    </div>
  </div>

  <!-- My Nets Modal ("Hedefe Kaç Net Kaldı?") -->
  <div class="modal-overlay" id="myNetsModalOverlay" aria-hidden="true">
    <div class="modal" style="width:min(600px, 100%);" role="dialog" aria-labelledby="myNetsTitle">
      <div class="modal-header">
        <h3 id="myNetsTitle">Benim Güncel Netlerim (YKS 2027)</h3>
        <button class="btn btn-ghost btn-icon btn-sm" id="closeMyNetsBtn" aria-label="Kapat">
          <svg class="sf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="myNetsModalBody"></div>
    </div>
  </div>

  <!-- Abroad Program Add / Edit Modal -->
  <div class="modal-overlay" id="abroadModalOverlay" aria-hidden="true">
    <div class="modal" style="width:min(620px, 100%);" role="dialog" aria-labelledby="abroadModalTitle">
      <div class="modal-header">
        <h3 id="abroadModalTitle">Yurt Dışı Program Ekle</h3>
        <button class="btn btn-ghost btn-icon btn-sm" id="closeAbroadModalBtn" aria-label="Kapat">
          <svg class="sf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="abroadModalBody"></div>
    </div>
  </div>

  <!-- Cloud Sync & Backup Modal -->
  <div class="modal-overlay" id="syncModalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="syncModalTitle">
      <div class="modal-header">
        <h3 id="syncModalTitle">Bulut Eşitleme & Yedek</h3>
        <button class="btn btn-ghost btn-icon btn-sm" id="closeSyncModalBtn" aria-label="Kapat">
          <svg class="sf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="syncModalBody"></div>
    </div>
  </div>

  <!-- ÖSYM AİS Copy Assistant & Share Link Modal -->
  <div class="modal-overlay" id="osymModalOverlay" aria-hidden="true">
    <div class="modal" style="width:min(620px, 100%);" role="dialog" aria-labelledby="osymModalTitle">
      <div class="modal-header">
        <h3 id="osymModalTitle">ÖSYM AİS Kopyalama & Paylaşım</h3>
        <button class="btn btn-ghost btn-icon btn-sm" id="closeOsymModalBtn" aria-label="Kapat">
          <svg class="sf-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="osymModalBody"></div>
    </div>
  </div>

  <!-- Floating Pill Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
